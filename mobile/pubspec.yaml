name: cupid_ai
description: "AI Flirting Assistant - Cupid AI"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.1

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State management
  flutter_bloc: ^9.1.1
  bloc: ^9.0.0
  equatable: ^2.0.7

  # Navigation
  go_router: ^15.1.2

  # Dependency injection
  get_it: ^8.0.3

  # Networking
  dio: ^5.8.0+1

  # Local storage
  shared_preferences: ^2.5.3
  flutter_secure_storage: ^9.2.4

  # UI & responsive
  google_fonts: ^6.2.1
  cached_network_image: ^3.4.1
  shimmer: ^3.0.0
  lottie: ^3.3.1
  flutter_svg: ^2.2.1
  flutter_screenutil: ^5.9.3
  flutter_gen: ^5.12.0

  # Utilities
  intl: ^0.20.2
  uuid: ^4.5.1
  logger: ^2.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  build_runner: ^2.4.15
  flutter_gen_runner: ^5.12.0
  bloc_test: ^10.0.0
  mocktail: ^1.0.4

flutter_gen:
  output: lib/gen/
  line_length: 80

  integrations:
    flutter_svg: false
    lottie: false

  colors:
    inputs:
      - assets/colors/colors.xml
    outputs:
      class_name: AppColors

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
    - assets/animations/
    - assets/colors/
    - assets/fonts/

  # Poppins font files — download from https://fonts.google.com/specimen/Poppins
  # and place the .ttf files in assets/fonts/ matching these names exactly.
  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
        - asset: assets/fonts/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700
